[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "agent-lab"
version = "0.1.0"
description = "Live agent benchmarking — provision, run, capture, report."
requires-python = ">=3.11"
dependencies = [
    "docker>=7.0",
    "requests>=2.31",
    "PyYAML>=6.0",
    "rich>=13.0",
    "gitpython>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]

[project.scripts]
lab = "cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
